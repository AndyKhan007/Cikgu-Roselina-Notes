<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cikgu Roselina Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="./style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            milk: '#FFFDF5',
            milky: '#FDF6E3',
            road: '#2B2B2B',
            cyanGlow: '#00E5FF',
            stopRed: '#D7263D',
            goGreen: '#1B998B',
            warnYellow: '#F4A259'
          },
          fontFamily: {
            roboto: ['Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="font-roboto bg-milk text-road min-h-screen">

  <!-- ===================== LOADING ===================== -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-milk">
    <div id="loading-sign" class="w-32 h-32 flex items-center justify-center"></div>
    <p class="mt-6 text-sm tracking-widest text-road/60" data-i18n="MEMUAT...">MEMUAT...</p>
    <p class="mt-1 text-xs text-road/40">Cikgu Roselina Notes</p>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app" class="hidden min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-milk border-b border-road/10 sticky top-0 z-30 relative">

      <div id="carTrack" class="car-track" aria-hidden="true">
        <div id="cuteCar" class="cute-car"></div>
      </div>

      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between relative z-10">

        <!-- LOGO -->
        <a href="#/" class="flex items-center gap-2 shrink-0">
          <div class="w-9 h-9 flex items-center justify-center" id="logoTraffic" aria-label="Lampu lalu lintas">
            <svg viewBox="0 0 26 50" class="w-7 h-9">
              <rect x="3" y="1" width="20" height="48" rx="6" fill="#2B2B2B"/>
              <rect x="3" y="1" width="20" height="48" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1"/>
              <circle class="tl-light tl-red"    cx="13" cy="11" r="4.2" />
              <circle class="tl-light tl-yellow" cx="13" cy="25" r="4.2" />
              <circle class="tl-light tl-green"  cx="13" cy="39" r="4.2" />
            </svg>
          </div>
          <div class="leading-tight">
            <p class="font-bold text-sm">Cikgu Roselina</p>
            <p class="text-[10px] text-road/60">Smart Notes</p>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-1 text-sm">
          <a href="#/" class="nav-link" data-i18n="Menu">Menu</a>
          <a href="#/notes" class="nav-link" data-i18n="Catatan">Catatan</a>
          <a href="#/groups" class="nav-link" data-i18n="Group">Group</a>
          <a href="#/slide" class="nav-link" data-i18n="Slide">Slide</a>
        </nav>

        <div class="flex items-center gap-1 shrink-0">
          <!-- Tombol ganti bahasa -->
          <button id="btn-lang" type="button" title="Language"
            class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-road/5 transition text-lg">
            🌐
          </button>

          <div id="auth-area" class="flex items-center gap-2">
            <!-- diisi oleh auth.js -->
          </div>
        </div>
      </div>
    </header>

    <!-- ROUTE VIEW -->
    <main id="view" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6"></main>

    <!-- FOOTER -->
    <footer class="border-t border-road/10 py-4 text-center text-xs text-road/50">
      <span data-i18n="© 2026 Cikgu Roselina Notes · Aplikasi catatan sekolah mengemudi">© 2026 Cikgu Roselina Notes · Aplikasi catatan sekolah mengemudi</span>
    </footer>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="bg-road text-milk px-4 py-2 rounded-full text-sm shadow-lg"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
